<title>Thailand Block Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
:root{
  color-scheme:dark;
  --edge:#000;
  --panel:#c6c6c6;
  --panel-hi:#ffffff;
  --panel-lo:#555555;
  --slot:#8b8b8b;
  --slot-dark:#373737;
  --ink:#3f3f3f;
  --ink-soft:#5c5c5c;
  --text:#ffffff;
  --text-shadow:#3f3f3f;
  --yellow:#ffff55;
  --aqua:#55ffff;
  --blue:#5555ff;
  --gray:#aaaaaa;
  --purple:#aa00aa;
  --water:#28419c;
  --ground:#1f150e;
  --pixel:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --thai:'Kanit','Noto Sans Thai',Tahoma,sans-serif;
}
html,body{height:100%}
body{
  background-color:var(--ground);
  background-size:64px 64px;
  image-rendering:pixelated;
  color:var(--text);
  font-family:var(--pixel);
  font-size:15px;
}
.app{
  box-sizing:border-box;
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 420px;
  gap:16px;
  padding:16px;
}
/* ---------- Map ---------- */
.map-wrap{
  position:relative;
  min-height:0;
  overflow:hidden;
  background:var(--water);
  border:2px solid var(--edge);
  box-shadow:inset 0 0 0 2px #1b2d6e;
  touch-action:none;
}
#map{display:block;width:100%;height:100%;cursor:grab;image-rendering:pixelated}
#map.dragging{cursor:grabbing}
#map.over{cursor:pointer}
.f3{
  position:absolute;left:8px;top:8px;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  font-size:13px;line-height:1.15;pointer-events:none;
}
.f3 span{background:rgba(80,80,80,.62);padding:1px 4px;text-shadow:2px 2px 0 var(--text-shadow);white-space:nowrap}
.f3 .th{font-family:var(--thai);font-size:12px}
.ctrls{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.hint{position:absolute;left:8px;bottom:10px;font-size:12px;color:#e0e0e0;text-shadow:2px 2px 0 #1a1a1a;pointer-events:none}
/* ---------- Minecraft buttons & inputs ---------- */
.mcbtn{
  font:inherit;font-size:14px;color:var(--text);
  text-shadow:2px 2px 0 var(--text-shadow);
  background:#727272;
  border:2px solid var(--edge);
  box-shadow:inset 2px 2px 0 #a9a9a9,inset -2px -3px 0 #3d3d3d;
  padding:6px 12px;min-width:40px;cursor:pointer;
}
.mcbtn:hover{background:#7f86b8;box-shadow:inset 2px 2px 0 #bcc3f2,inset -2px -3px 0 #464d80}
.mcbtn:active{transform:translateY(1px)}
.mcbtn:focus-visible,.slot:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
.mcinput{
  box-sizing:border-box;width:100%;
  font:inherit;font-size:15px;color:#e0e0e0;
  background:#000;border:2px solid #a0a0a0;padding:6px 8px;
}
.mcinput:focus{outline:none;border-color:#fff}
.mcinput::placeholder{color:#707070}
/* ---------- Side panel ---------- */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-color:#6f6f6f #1f150e}
.brand{position:relative;text-align:center;padding-block:10px 4px}
.logo{
  margin:0;font-family:'Press Start 2P',var(--pixel);font-weight:400;
  font-size:30px;letter-spacing:1px;color:#c9c9c9;
  text-shadow:2px 2px 0 #8a8a8a,4px 4px 0 #4a4a4a,6px 6px 0 #1a1a1a;
}
.edition{margin:10px 0 0;font-size:13px;letter-spacing:.3em;color:#e8e8e8;text-shadow:2px 2px 0 #333}
.edition .th{font-family:var(--thai);letter-spacing:0}
.splash{
  position:absolute;right:4px;top:40px;
  font-size:15px;font-weight:600;color:var(--yellow);text-shadow:2px 2px 0 #3f3f15;
  transform:rotate(-16deg);animation:splash .55s ease-in-out infinite alternate;pointer-events:none;
}
@keyframes splash{from{transform:rotate(-16deg) scale(.94)}to{transform:rotate(-16deg) scale(1.06)}}
.gui{
  background:var(--panel);color:var(--ink);
  border:2px solid var(--edge);
  box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 var(--panel-lo);
  padding:12px;
}
.gui h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--ink)}
.slot{
  position:relative;box-sizing:border-box;
  display:grid;place-items:center;
  aspect-ratio:1;max-width:100%;
  background:var(--slot);
  border:0;padding:0;margin:0;cursor:pointer;
  box-shadow:inset 2px 2px 0 var(--slot-dark),inset -2px -2px 0 #fff;
}
.slot img{width:78%;height:78%;image-rendering:pixelated;pointer-events:none}
.slot:hover::after,.slot.hl::after{content:"";position:absolute;inset:2px;background:rgba(255,255,255,.4)}
.slot.on{background:#5f7a4a}
.slot.dim{opacity:.28}
/* selected card */
.sel{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.sel .big{width:84px}
.sel .big img{width:84%;height:84%}
.sel-name{margin:0;font-size:21px;font-weight:600;line-height:1.1;color:#262626;text-wrap:balance}
.sel-th{font-family:var(--thai);font-size:16px;color:var(--ink-soft);margin-top:2px}
.sel-item{margin-top:6px;font-size:15px;color:#7a5b00}
.sel-item b{font-weight:600}
.lore{margin:12px 0 0;font-size:15px;line-height:1.4;color:#303030;max-width:65ch}
.meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;background:#8b8b8b;color:#fff;text-shadow:1px 1px 0 #3f3f3f;padding:2px 6px;box-shadow:inset 1px 1px 0 #373737,inset -1px -1px 0 #d8d8d8}
.nb{margin-top:12px}
.nb-label{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:inherit;font-size:13px;cursor:pointer;color:#262626;
  display:inline-flex;align-items:center;gap:4px;
  background:#dcdcdc;border:2px solid #000;padding:2px 6px 2px 3px;
  box-shadow:inset -2px -2px 0 #9a9a9a;
}
.chip img{width:18px;height:18px;image-rendering:pixelated}
.chip:hover{background:#fff}
.sel-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
/* tabs + grid */
.inv-wrap{display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding-left:4px;flex-wrap:wrap}
.tab{
  position:relative;top:2px;
  width:44px;height:40px;display:grid;place-items:center;cursor:pointer;
  background:#a3a3a3;border:2px solid #000;border-bottom:0;padding:0;
  box-shadow:inset 2px 2px 0 #dcdcdc;
}
.tab img{width:26px;height:26px;image-rendering:pixelated}
.tab .all{font-size:12px;font-weight:600;color:#3f3f3f}
.tab[aria-selected="true"]{background:var(--panel);height:44px;top:2px;margin-top:-4px;z-index:1;box-shadow:inset 2px 2px 0 #fff}
.inv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.inv-head h2{margin:0}
.inv-head .count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;margin-top:10px}
.foot{margin:0;font-size:12px;line-height:1.5;color:#bfb4a8;text-shadow:1px 1px 0 #000;padding-bottom:4px}
.foot a{color:var(--aqua)}
/* tooltip */
.tip{
  position:fixed;z-index:10;left:0;top:0;pointer-events:none;
  max-width:260px;padding:6px 9px 7px;
  background:rgba(16,0,16,.94);
  border:2px solid #100010;
  box-shadow:inset 0 0 0 2px #2c0a6b;
  font-size:14px;line-height:1.3;color:#fff;text-shadow:2px 2px 0 #2b2b2b;
}
.tip .t-name{color:#fff;font-weight:600}
.tip .t-th{font-family:var(--thai);color:var(--gray);font-size:13px}
.tip .t-item{color:var(--yellow)}
.tip .t-reg{color:#7c7cff}
.tip .t-hint{color:#6f6f6f;font-size:12px;margin-top:2px}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  .map-wrap{height:62vh;min-height:360px}
  .side{overflow:visible}
  .logo{font-size:24px}
  .f3{font-size:11px}
  .f3 .th{font-size:11px}
  .hint{display:none}
}
@media (max-width:420px){
  .sel{grid-template-columns:64px minmax(0,1fr)}
  .sel .big{width:64px}
  .tab{width:38px}
}
@media (prefers-reduced-motion:reduce){.splash{animation:none}}
</style>

<div class="app">
  <section class="map-wrap" id="mapWrap" aria-label="Block map of Thailand's provinces">
    <canvas id="map"></canvas>
    <div class="f3" id="f3" aria-hidden="true"></div>
    <div class="hint" id="hint">Drag to pan · scroll to zoom · click a province</div>
    <div class="ctrls">
      <button class="mcbtn" id="zin" aria-label="Zoom in">+</button>
      <button class="mcbtn" id="zout" aria-label="Zoom out">−</button>
      <button class="mcbtn" id="zfit">Fit</button>
    </div>
  </section>

  <aside class="side">
    <header class="brand">
      <h1 class="logo">THAILAND</h1>
      <p class="edition">BLOCK ATLAS · <span class="th">แผนที่ 77 จังหวัด</span></p>
      <div class="splash" aria-hidden="true">77 provinces!</div>
    </header>

    <section class="gui" id="selPanel" aria-live="polite"></section>

    <section class="inv-wrap">
      <div class="tabs" role="tablist" id="tabs" aria-label="Regions"></div>
      <div class="gui">
        <div class="inv-head"><h2 id="invTitle">All provinces</h2><span class="count" id="invCount"></span></div>
        <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Search provinces</label>
        <input id="q" class="mcinput" type="search" placeholder="Search provinces or items…" autocomplete="off">
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <p class="foot">Province boundaries from the <a href="https://github.com/apisit/thailand.json" target="_blank" rel="noopener">thailand.json</a> dataset, rasterized to 0.04° blocks (about 4.4 km per block). Terrain height and trees are generated for looks, not surveyed.</p>
  </aside>
</div>
<div class="tip" id="tip" hidden></div>

    for(let c=0;c<16;c++){const ch=row[c];if(ch!=='.'&&PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(c+1,r+1,1,1);on[(r+1)*18+c+1]=1;}}}
  // soft dark outline so items read on any terrain
  x.fillStyle='rgba(20,14,10,.55)';
  for(let r=0;r<18;r++)for(let c=0;c<18;c++){
    if(on[r*18+c])continue;
    if((c>0&&on[r*18+c-1])||(c<17&&on[r*18+c+1])||(r>0&&on[(r-1)*18+c])||(r<17&&on[(r+1)*18+c]))x.fillRect(c,r,1,1);

}

function cellAt(sx,sy){const c=Math.floor((sx-view.x)/view.s/B),r=Math.floor((sy-view.y)/view.s/B);if(c<0||r<0||c>=W||r>=H)return null;return {r,c,v:grid[r*W+c]};}

/* ================= F3 overlay ================= */
const f3=document.getElementById('f3');
function updateF3(cell){
  const ref=cell||(selected>=0?{r:provs[selected].anchor[0],c:provs[selected].anchor[1],v:selected}:null);
  let lines=['ThaiCraft Atlas · 77 provinces'];
  if(ref){
    const lat=lat1-(ref.r+.5)*S,lon=lon0+(ref.c+.5)*S;
    lines.push(`Lat ${lat.toFixed(2)}° N  Lon ${lon.toFixed(2)}° E`);
    let biome='minecraft:ocean';
    if(ref.v>=0)biome='minecraft:'+REG[provs[ref.v].reg].biome;else if(ref.v===-2)biome='(outside Thailand)';
    lines.push('Biome: '+biome);
    if(ref.v>=0)lines.push(`Province: ${provs[ref.v].en} <span class="th">${provs[ref.v].th}</span>`);
  }
  f3.innerHTML=lines.map(l=>`<span>${l}</span>`).join('');
}

/* ================= Tooltip ================= */
const tip=document.getElementById('tip');
function showTip(i,x,y,hint){
  const p=provs[i];
  tip.innerHTML=`<div class="t-name">${p.en}</div><div class="t-th">${p.th}</div><div class="t-item">✦ ${p.item}</div><div class="t-reg">${REG[p.reg].name} · ${REG[p.reg].biome.replace(/_/g,' ')}</div>${hint?`<div class="t-hint">${hint}</div>`:''}`;
  tip.hidden=false;
  const r=tip.getBoundingClientRect();
  let tx=x+16,ty=y+14;if(tx+r.width>innerWidth-8)tx=x-r.width-12;if(ty+r.height>innerHeight-8)ty=y-r.height-10;
  tip.style.transform=`translate(${Math.max(4,tx)}px,${Math.max(4,ty)}px)`;
}
function hideTip(){tip.hidden=true;}

/* ================= Pointer input ================= */
const pts=new Map();let down=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pts.size===1){down={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y,moved:false};tween=null;}
  else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,vx:view.x,vy:view.y};down&&(down.moved=true);}
});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pinch&&pts.size>=2){
    const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const ns=Math.max(fitS*.8,Math.min(4,pinch.s*d/pinch.d));const k=ns/pinch.s;
    view.s=ns;view.x=mx-(pinch.mx-pinch.vx)*k;view.y=my-(pinch.my-pinch.vy)*k;dirty=true;return;
  }
  if(down&&pts.size===1){
    const dx=e.offsetX-down.x,dy=e.offsetY-down.y;
    if(Math.abs(dx)+Math.abs(dy)>5){down.moved=true;cv.classList.add('dragging');}
    if(down.moved){view.x=down.vx+dx;view.y=down.vy+dy;dirty=true;hideTip();return;}
  }
  const cell=cellAt(e.offsetX,e.offsetY);const v=cell&&cell.v>=0?cell.v:-1;
  if(v!==hover){hover=v;dirty=true;}
  cv.classList.toggle('over',v>=0);
  updateF3(cell);
  if(e.pointerType==='mouse'&&v>=0)showTip(v,e.clientX,e.clientY,'Click to inspect');else hideTip();
});
function endPtr(e){
  const wasClick=down&&!down.moved&&pts.size===1;
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;
  if(pts.size===0){cv.classList.remove('dragging');
    if(wasClick&&e.type==='pointerup'){const cell=cellAt(e.offsetX,e.offsetY);if(cell&&cell.v>=0)select(cell.v,false);}
    down=null;}
  else if(pts.size===1){const [p]=[...pts.values()];down={x:p.x,y:p.y,vx:view.x,vy:view.y,moved:true};}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hover=-1;dirty=true;hideTip();updateF3(null);}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0016)),e.offsetX,e.offsetY);},{passive:false});
document.getElementById('zin').onclick=()=>{tween=null;zoomAt(1.5,cw/2,chh/2);};
document.getElementById('zout').onclick=()=>{tween=null;zoomAt(1/1.5,cw/2,chh/2);};
document.getElementById('zfit').onclick=()=>goTo(fitView(false));

/* ================= Side panel ================= */
const selPanel=document.getElementById('selPanel');
function select(i,fly=true){
  selected=i;dirty=true;const p=provs[i];const R=REG[p.reg];
  selPanel.innerHTML=`
    <div class="sel">
      <div class="slot big" aria-hidden="true"><img src="${sprite(p.spr).url}" alt=""></div>
      <div>
        <h2 class="sel-name">${p.en}</h2>
        <div class="sel-th">${p.th}</div>
        <div class="sel-item">Iconic item: <b>${p.item}</b></div>
      </div>
    </div>
    <p class="lore">${p.lore}</p>
    <div class="meta"><span class="tag">${R.name} · <span style="font-family:var(--thai)">${R.th}</span></span><span class="tag">minecraft:${R.biome}</span><span class="tag">${D.cells[i]} blocks</span></div>
    <div class="nb"><div class="nb-label">Neighboring provinces</div><div class="chips">${
      p.adj.map(j=>`<button class="chip" data-i="${j}"><img src="${sprite(provs[j].spr).url}" alt="">${provs[j].en}</button>`).join('')||'<span class="nb-label">None (island)</span>'
    }</div></div>
    <div class="sel-actions"><button class="mcbtn" id="tpRand">/tp random</button><button class="mcbtn" id="flyTo">Fly to ${p.en}</button></div>`;
  selPanel.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(+b.dataset.i));
  selPanel.querySelector('#tpRand').onclick=()=>{let j;do{j=Math.floor(Math.random()*77);}while(j===selected);select(j);};
  selPanel.querySelector('#flyTo').onclick=()=>focusProv(i);
  gridEl.querySelectorAll('.slot').forEach(s=>s.classList.toggle('on',+s.dataset.i===i));
  updateF3(null);
  if(fly)focusProv(i);
}

// tabs
const tabsEl=document.getElementById('tabs'),gridEl=document.getElementById('grid'),qEl=document.getElementById('q');
let tab='all';
const tabDefs=[['all','All provinces',null],...REG_ORDER.map(k=>[k,`${REG[k].name} · ${REG[k].th}`,provs.find(p=>p.reg===k).spr])];
tabDefs.forEach(([k,label,spr])=>{
  const b=document.createElement('button');b.className='tab';b.role='tab';b.id='tab-'+k;b.title=label;b.setAttribute('aria-label',label);
  b.innerHTML=spr?`<img src="${sprite(spr).url}" alt="">`:'<span class="all">ALL</span>';
  b.onclick=()=>{tab=k;renderGrid();};tabsEl.appendChild(b);
});
function renderGrid(){
  tabsEl.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.id==='tab-'+tab));
  const list=provs.filter(p=>tab==='all'||p.reg===tab)
    .sort((a,b)=>REG_ORDER.indexOf(a.reg)-REG_ORDER.indexOf(b.reg)||a.en.localeCompare(b.en));
  const q=qEl.value.trim().toLowerCase();
  gridEl.innerHTML='';let hits=0;
  const total=Math.max(27,Math.ceil(list.length/9)*9);
  for(let n=0;n<total;n++){
    const p=list[n];const s=document.createElement(p?'button':'div');s.className='slot';
    if(p){
      const match=!q||p.en.toLowerCase().includes(q)||p.th.includes(q)||p.item.toLowerCase().includes(q);
      if(match)hits++;
      s.dataset.i=p.i;s.setAttribute('aria-label',`${p.en}: ${p.item}`);
      s.innerHTML=`<img src="${sprite(p.spr).url}" alt="">`;
      if(!match)s.classList.add('dim');
      if(p.i===selected)s.classList.add('on');
      s.onclick=()=>select(p.i);
      s.onmouseenter=e=>{hover=p.i;dirty=true;showTip(p.i,e.clientX,e.clientY);};
      s.onmousemove=e=>showTip(p.i,e.clientX,e.clientY);
      s.onmouseleave=()=>{hover=-1;dirty=true;hideTip();};
    }
    gridEl.appendChild(s);
  }
  document.getElementById('invTitle').textContent=tab==='all'?'All provinces':REG[tab].name;
  document.getElementById('invCount').textContent=q?`${hits} match${hits===1?'':'es'}`:`${list.length} provinces`;
}
qEl.addEventListener('input',renderGrid);
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=qEl.value.trim().toLowerCase();const p=provs.find(p=>p.en.toLowerCase().includes(q)||p.th.includes(q)||p.item.toLowerCase().includes(q));if(q&&p)select(p.i);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();}});

// dirt background (Minecraft options-screen style)
(function(){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
  const cols=['#866043','#593d29','#79553a','#6b4a30','#966c4a'];
  for(let i=0;i<256;i++){x.fillStyle=cols[Math.floor(h2(i%16,i>>4,99)*cols.length)];x.fillRect(i%16,i>>4,1,1);}
  x.fillStyle='rgba(0,0,0,.66)';x.fillRect(0,0,16,16);
  document.body.style.backgroundImage=`url(${c.toDataURL()})`;})();

resize();
renderGrid();
select(provs.findIndex(p=>p.geo==='Bangkok Metropolis'),false);
if(document.fonts)document.fonts.ready.then(()=>{dirty=true;});
requestAnimationFrame(loop);
</script>
