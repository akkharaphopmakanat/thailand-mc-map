<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thailand Block Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/style.css">

<div class="app">
  <section class="map-wrap" id="mapWrap" aria-label="Block map of Thailand's provinces">
    <canvas id="map"></canvas>
    <canvas id="map3d" hidden></canvas>
    <div class="f3" id="f3" aria-hidden="true"></div>
    <fieldset class="layers" id="layers">
      <legend>Layers</legend>
      <label><input type="checkbox" name="roads" checked> <i class="sw sw-road"></i>Main roads</label>
      <label><input type="checkbox" name="localRoads"> <i class="sw sw-local"></i>Local roads</label>
      <label><input type="checkbox" name="rails" checked> <i class="sw sw-rail" id="railIcon"></i>Railways</label>
      <label><input type="checkbox" name="rivers" checked> <i class="sw sw-river"></i>Main rivers</label>
      <label><input type="checkbox" name="streams"> <i class="sw sw-stream"></i>Small rivers</label>
    </fieldset>
    <div class="hint" id="hint">Drag to pan · scroll to zoom · click a province, then a district</div>
    <div class="ctrls">
      <button class="mcbtn" id="vscale" hidden title="Vertical scale: real metres per block">40 m/block</button>
      <button class="mcbtn" id="mode" aria-label="Switch to 3D view">3D</button>
      <button class="mcbtn" id="zin" aria-label="Zoom in">+</button>
      <button class="mcbtn" id="zout" aria-label="Zoom out">−</button>
      <button class="mcbtn" id="zfit">Fit</button>
    </div>
    <div class="loading" id="loading">
      <div id="loadMsg">Loading world…</div>
      <div class="bar"><i id="loadBar"></i></div>
    </div>
  </section>

  <aside class="side">
    <header class="brand">
      <h1 class="logo">THAILAND</h1>
      <p class="edition">BLOCK ATLAS · <span class="th">แผนที่ 77 จังหวัด</span></p>
      <div class="splash" aria-hidden="true">928 districts!</div>
    </header>

    <section class="gui" id="selPanel" aria-live="polite"></section>

    <section class="inv-wrap">
      <div class="tabs" role="tablist" id="tabs" aria-label="Regions"></div>
      <div class="gui">
        <div class="inv-head"><h2 id="invTitle">All provinces</h2><span class="count" id="invCount"></span></div>
        <label for="q" style="position:absolute;left:-9999px">Search provinces</label>
        <input id="q" class="mcinput" type="search" placeholder="Search provinces or items…" autocomplete="off">
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <section class="gui credits" id="credits" aria-label="Credits">
      <h2>Credits</h2>
      <p class="cr-author">Made by <a href="https://github.com/akkharaphopmakanat/" target="_blank" rel="noopener">akkharaphopmakanat</a></p>
      <p class="cr-meta">Data: thailand.json (apisit), geoBoundaries THA ADM2 (CC BY 3.0 IGO), thai-province-data (MIT).</p>
    </section>
  </aside>
</div>
<div class="tip" id="tip" hidden></div>

<script type="module" src="js/main.js"></script>
